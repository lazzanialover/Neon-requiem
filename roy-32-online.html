<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON REQUIEM • ROY 32</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02080d}iframe{width:100%;height:100%;border:0}#badge{position:fixed;top:5px;right:5px;padding:5px 8px;background:#001b1cdd;border:1px solid #4f8;color:#aef;font:11px monospace;pointer-events:none}</style></head><body><iframe id="game" src="./index.html?build=roy32"></iframe><div id="badge">ROY 32 • ЗАГРУЗКА</div><script>
const frame=document.getElementById('game'),badge=document.getElementById('badge');
frame.onload=()=>{try{const w=frame.contentWindow;
w.eval(`
(function(){
const original=actor;
const atlas=document.createElement('canvas');atlas.width=90*8;atlas.height=120*4;
const ac=atlas.getContext('2d');let ready=false;
function make(){
 if(ready)return true;
 if(!['front','right','back','left'].every(d=>royArt[d]?.complete&&royArt[d]?.naturalWidth))return false;
 for(let row=0;row<4;row++){
  const dir=['front','right','back','left'][row],im=royArt[dir],iw=im.naturalWidth,ih=im.naturalHeight;
  const hip=Math.floor(ih*.70),dw=dir==='front'?59:56,dh=105;
  for(let i=0;i<8;i++){
   const phase=i*Math.PI/4,step=Math.sin(phase),opp=Math.cos(phase),xx=i*90+45,yy=row*120+106;
   ac.save();ac.translate(xx,yy);ac.fillStyle='#0007';ac.beginPath();ac.ellipse(0,0,20,5,0,0,7);ac.fill();
   for(const left of [false,true]){
    const lift=Math.max(0,(left?opp:-opp))*9;
    ac.save();ac.translate(dw*(left?-.22:.22),-dh*.31);ac.rotate((left?1:-1)*step*.36);
    ac.drawImage(im,iw*(left?0:.5),hip,iw*.5,ih-hip,-dw*.25,-lift,dw*.5,dh*.30);ac.restore();
   }
   ac.drawImage(im,0,0,iw,hip,-dw/2,-dh,dw,dh*.70);
   ac.restore();
  }
 }
 ready=true;return true;
}
actor=function(x,y,a,enemy=false,heavy=false,flash=0){
 if(enemy)return original(x,y,a,enemy,heavy,flash);
 if(!make())return original(x,y,a,enemy,heavy,flash);
 const moving=!!(p.moving&&active),idx=moving?((Math.floor((p.walk||0)*8/(Math.PI*2))%8+8)%8):0;
 const row={front:0,right:1,back:2,left:3}[p.dir||'front']??0;
 ctx.save();ctx.translate(x,y);ctx.drawImage(atlas,idx*90,row*120,90,120,-45,-100,90,120);ctx.restore();
};
window.__roy32Ready=true;
})();
`);
if(!w.__roy32Ready)throw Error('патч не подключён');badge.textContent='ROY 32 • ПОДКЛЮЧЕНО';
}catch(e){badge.textContent='ROY 32 • ОШИБКА: '+e.message;badge.style.color='#f88'}};
</script></body></html>

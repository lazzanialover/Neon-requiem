<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROY | motion diagnostics</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07121a;color:#a4ffdf;font:12px monospace;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:12px;left:12px;background:#06121eea;padding:12px;border:1px solid #397e75;border-radius:7px;line-height:1.6;pointer-events:none}#pad{position:fixed;bottom:22px;left:14px;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:5px}button{border:1px solid #4f978b;background:#092832dd;color:#afffe2;border-radius:9px;font-size:23px;touch-action:none}#run{position:fixed;bottom:91px;right:18px;width:94px;height:56px;font-size:16px}#dash{position:fixed;bottom:24px;right:18px;width:94px;height:56px;font-size:16px}</style></head><body><canvas id="c"></canvas><div id="ui"><b>NEON REQUIEM // ROY MOTION TEST</b><div>WASD / стрелки — движение · Shift — бег</div><div id="state">ЗАПУЩЕНО · без загрузки внешних файлов</div></div><div id="pad"><span></span><button data-key="w">▲</button><span></span><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><button id="run" data-key="shift">БЕГ</button><button id="dash" data-key=" ">РЫВОК</button><script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d');let W=0,H=0,dpr=1,x=0,y=0,vx=0,vy=0,phase=0,last=performance.now(),facing=0,tail=0,dash=0,dashLatch=false;const key={};function size(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);if(!x){x=W/2;y=H*.57}}addEventListener('resize',size);size();addEventListener('keydown',e=>{key[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>{key[e.key.toLowerCase()]=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();key[k]=true;b.setPointerCapture(e.pointerId)});for(let name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>key[k]=false)});function ln(a,b,c,d,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}function shape(pts,col,edge){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=col;g.fill();if(edge){g.lineWidth=1.5;g.strokeStyle=edge;g.stroke()}}function ell(a,b,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(a,b,rx,ry,0,0,Math.PI*2);g.fill()}function roy(speed,dir){g.save();g.translate(x,y);const mv=Math.min(1,speed/115),s=Math.sin(phase),q=Math.sin(phase+Math.PI),back=dir===2,side=dir===1||dir===3,sign=dir===3?-1:1,bob=mv*Math.abs(s)*2.5;ell(0,1,27,9,'#000b');g.translate(0,-bob);let swing=mv*(key.shift?13:8);for(let i=0;i<2;i++){let z=i?1:-1,step=i?s:q,fx=z*10+step*swing,fy=Math.max(0,-step)*5;ln(z*8,-35,z*8+step*5*mv,-17,12,'#25343c');ln(z*8+step*5*mv,-17,fx,-3+fy,10,'#34434b');ell(fx,-2+fy,7,4,'#131e27');ln(fx-4,-2+fy,fx+4,-2+fy,2,'#72818a')}
 // coat with split tails and lagging fabric
 let wind=tail*sign;for(let i=0;i<2;i++){let z=i?1:-1;shape([[z*3,-56],[z*19,-52],[z*(24+wind),-10],[z*7+wind*.6,-18]],i?'#192b33':'#243941','#3d5d65');ln(z*12,-46,z*13+wind*.6,-17,1,'#52727a')}
 shape([[-18,-71],[18,-71],[23,-47],[14,-34],[-14,-34],[-23,-47]],'#1e3039','#607781');shape([[-12,-68],[0,-75],[12,-68],[10,-44],[-10,-44]],'#293f48','#58727a');ln(-13,-37,13,-37,5,'#0a181d');
 for(let i=0;i<2;i++){let z=i?1:-1,st=i?s:q,ey=-49+st*mv*7,hy=-33+st*mv*10;ln(z*19,-66,z*26,ey,12,'#263b45');ln(z*26,ey,z*25,hy,9,'#1b3038');ell(z*25,hy,5,5,'#57666c');if(i===0){g.shadowColor='#24ffc3';g.shadowBlur=9;ln(z*29,hy-3,z*21,hy-3,4,'#39e6ac');g.shadowBlur=0}}
 // backpack on rear and silhouette-aware visor
 if(back){shape([[-13,-69],[13,-69],[16,-42],[-16,-42]],'#0d2429','#47806c');g.shadowColor='#19ff99';g.shadowBlur=13;ln(-4,-62,-4,-48,3,'#27e9a0');ln(4,-62,4,-48,3,'#27e9a0');g.shadowBlur=0}
 shape([[-14,-71],[-12,-84],[12,-84],[14,-71],[7,-65],[-7,-65]],'#172c35','#5a7781');ell(0,-91,14,15,'#293c46');shape([[-13,-97],[-8,-107],[9,-106],[14,-96],[11,-88],[-11,-88]],'#202f3b','#647b81');
 if(!back){g.shadowColor='#1fff9f';g.shadowBlur=14;ln(side?-3:-9,-91,side?11:9,-91,5,'#43ffa8');g.shadowBlur=0}else ln(0,-104,0,-91,3,'#65817e');
 g.restore()}
function tick(n){let dt=Math.min(.04,(n-last)/1000);last=n;let dx=+(key.d||key.arrowright)-+(key.a||key.arrowleft),dy=+(key.s||key.arrowdown)-+(key.w||key.arrowup),m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;let running=!!key.shift,speed=running?220:140;if(key[' ']&&!dashLatch&&Math.hypot(dx,dy)>0){dash=.17}dashLatch=!!key[' '];dash=Math.max(0,dash-dt);let boost=dash>0?2.5:1;vx+=(dx*speed*boost-vx)*Math.min(1,dt*13);vy+=(dy*speed*boost-vy)*Math.min(1,dt*13);x=Math.max(35,Math.min(W-35,x+vx*dt));y=Math.max(125,Math.min(H-25,y+vy*dt));let v=Math.hypot(vx,vy);if(v>12)phase+=dt*(running?15:10)*Math.min(1,v/110);if(Math.abs(vy)>Math.abs(vx)*.7)facing=vy>0?0:2;else if(Math.abs(vx)>15)facing=vx>0?1:3;tail+=(Math.min(1,v/220)*6-tail)*Math.min(1,dt*5);
 g.fillStyle='#07121a';g.fillRect(0,0,W,H);g.strokeStyle='#1a343c';g.lineWidth=1;for(let i=0;i<W;i+=65){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke()}for(let i=0;i<H;i+=65){g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke()}let glow=g.createRadialGradient(x,y-55,10,x,y-55,210);glow.addColorStop(0,'#1a7d6540');glow.addColorStop(1,'#1a7d6500');g.fillStyle=glow;g.fillRect(x-220,y-260,440,440);g.fillStyle='#4dffb3';g.fillRect(x-7,y-105,14,105);document.getElementById('state').textContent='КАДР '+Math.round(n)+' · x='+Math.round(x)+' y='+Math.round(y);try{roy(v,facing)}catch(err){g.fillStyle='#42ffb4';g.fillRect(x-14,y-85,28,80);document.getElementById('state').textContent='ОШИБКА: '+err.message;requestAnimationFrame(tick);return;}document.getElementById('state').textContent=(v>12?(running?'БЕГ':'ХОДЬБА'):'ОЖИДАНИЕ')+' · '+['ВПЕРЁД','ВПРАВО','СПИНОЙ','ВЛЕВО'][facing]+' · '+Math.round(v)+' px/s';requestAnimationFrame(tick)}window.onerror=function(msg,src,line){document.getElementById('state').textContent='JS ERROR: '+msg+' : '+line;document.getElementById('state').style.color='#ff7777'};document.getElementById('state').textContent='JS ИНИЦИАЛИЗИРОВАН';requestAnimationFrame(tick)})();
</script></body></html>

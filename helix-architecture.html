(()=>{'use strict';const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d');let W,H,D,cam={x:0,y:0},t=0,playing=false,keys={},joy={x:0,y:0},pressed={},enemies=[],zones=[],fx=[];const T=70,rooms=[{x:2,y:3,w:10,h:9,n:'01 ШЛЮЗ',color:'#173848'},{x:15,y:3,w:12,h:9,n:'02 КРИО',color:'#164b53'},{x:30,y:3,w:13,h:9,n:'03 ИНФЕКЦИЯ',color:'#473044'},{x:30,y:16,w:13,h:12,n:'04 ЯДРО',color:'#4d2738'},{x:15,y:16,w:12,h:12,n:'05 ТЕХУЗЕЛ',color:'#253d50'},{x:2,y:16,w:10,h:12,n:'06 ЭВАКУАЦИЯ',color:'#27483e'}],bridges=[{x:12,y:6,w:3,h:3},{x:27,y:6,w:3,h:3},{x:34,y:12,w:4,h:4},{x:27,y:21,w:3,h:3},{x:12,y:21,w:3,h:3}],solids=[],objects=[];const player={x:5*T,y:8*T,hp:100,dir:0,attack:0,dash:0,infect:0,hypno:0,inv:0};function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}onresize=resize;resize();function r(x,y,w,h){return{x:x*T,y:y*T,w:w*T,h:h*T}}function inArea(x,y,a){return x>a.x&&x<a.x+a.w&&y>a.y&&y<a.y+a.h}function walkable(x,y){return rooms.some(q=>inArea(x,y,r(q.x+.25,q.y+.25,q.w-.5,q.h-.5)))||bridges.some(q=>inArea(x,y,r(q.x,q.y,q.w,q.h)))}function blocked(x,y,rad=15){return !walkable(x,y)||solids.some(s=>x+rad>s.x&&x-rad<s.x+s.w&&y+rad>s.y&&y-rad<s.y+s.h)}function move(a,x,y,rad=15){if(!blocked(a.x+x,a.y,rad))a.x+=x;if(!blocked(a.x,a.y+y,rad))a.y+=y}function add(x,y,w,h,type,height=55){let a={...r(x,y,w,h),type,height};objects.push(a);solids.push(a)}for(let i=0;i<rooms.length;i++){let q=rooms[i];add(q.x+2,q.y+2,1.4,2,i===1||i===2?'tank':'console',65);add(q.x+q.w-3,q.y+3,1.3,2,i===3?'reactor':'tank',85);add(q.x+q.w/2-1,q.y+q.h-3,2,.8,'console',35)}for(let i=1;i<rooms.length;i++){let q=rooms[i];for(let j=0;j<(i===3?7:4);j++){let x,y,k=0;do{x=(q.x+1+Math.random()*(q.w-2))*T;y=(q.y+1+Math.random()*(q.h-2))*T;k++}while(blocked(x,y,26)&&k<50);enemies.push({x,y,hp:i===3?95:55,max:i===3?95:55,stun:0,poison:0,room:i,cd:0,boss:false})}}enemies.push({x:36*T,y:23*T,hp:650,max:650,stun:0,poison:0,room:3,cd:0,boss:true});function glow(x,y,r,color){let a=g.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,color);a.addColorStop(1,'transparent');g.fillStyle=a;g.fillRect(x-r,y-r,r*2,r*2)}function cube(o){let{x,y,w,h,height,type}=o;g.fillStyle='#0008';g.fillRect(x+12,y+15,w,h);g.fillStyle=type==='tank'?'#286577':type==='reactor'?'#63334d':'#324a59';g.fillRect(x,y-height,w,h);g.fillStyle='#172b3b';g.beginPath();g.moveTo(x,y-height);g.lineTo(x+height*.32,y-height-26);g.lineTo(x+w+height*.32,y-height-26);g.lineTo(x+w,y-height);g.fill();g.fillStyle='#0b1b29';g.fillRect(x+w-10,y-height,10,h+height);g.strokeStyle='#7cc7d077';g.strokeRect(x,y-height,w,h);g.fillStyle=type==='reactor'?'#ff5479':'#5cf3e7';g.fillRect(x+12,y-height+14,w-24,7);glow(x+w/2,y-height+16,65,type==='reactor'?'#ff325b55':'#34ffe844')}function actor(a,isPlayer){let big=a.boss,rad=big?35:18,col=isPlayer?'#64edff':big?'#ff5279':a.poison>0?'#a2ff73':'#e26a86';g.fillStyle='#000a';g.beginPath();g.ellipse(a.x+6,a.y+11,rad*1.3,rad*.5,0,0,7);g.fill();glow(a.x,a.y,rad*2.6,isPlayer?'#42ddff33':'#ff38652b');g.fillStyle='#102234';g.fillRect(a.x-rad*.7,a.y-rad*.4,rad*1.4,rad*1.5);g.fillStyle=col;g.fillRect(a.x-rad*.75,a.y-rad*1.6,rad*1.5,rad*1.25);g.fillStyle='#e5f9ff';g.fillRect(a.x-rad*.55,a.y-rad*1.8,rad*1.1,rad*.35);if(!isPlayer){g.fillStyle='#ff546f';g.fillRect(a.x-rad,a.y-rad*2.4,rad*2*a.hp/a.max,4)}else{g.save();g.translate(a.x,a.y-15);g.rotate(a.dir);g.fillStyle='#b4ffff';g.fillRect(8,-4,26,8);g.restore()}}function puff(x,y,color){for(let i=0;i<14;i++)fx.push({x,y,vx:(Math.random()-.5)*230,vy:(Math.random()-.5)*230,life:.6,color})}function ability(type){if(!playing||player.hp<=0)return;if(type==='dash'&&player.dash<=0){player.dash=3;let x=joy.x||Math.cos(player.dir),y=joy.y||Math.sin(player.dir),l=Math.hypot(x,y)||1;for(let i=0;i<12;i++)move(player,x/l*20,y/l*20);puff(player.x,player.y,'#54dfff')}if(type==='infect'&&player.infect<=0){player.infect=8;zones.push({x:player.x,y:player.y,r:230,life:5});puff(player.x,player.y,'#aaff6a')}if(type==='hypno'&&player.hypno<=0){player.hypno=10;for(let e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<270)e.stun=4;puff(player.x,player.y,'#db83ff')}if(type==='fire'&&player.attack<=0){player.attack=.19;let near=enemies.filter(e=>Math.hypot(e.x-player.x,e.y-player.y)<380).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(near){player.dir=Math.atan2(near.y-player.y,near.x-player.x);near.hp-=27;puff(near.x,near.y,'#74ffff')}}}for(let id of ['fire','dash','infect','hypno']){$(id).addEventListener('pointerdown',e=>{e.preventDefault();pressed[id]=true;ability(id)});$(id).addEventListener('pointerup',()=>pressed[id]=false)}let stick=$('stick'),nub=$('nub');function joystick(e){let b=stick.getBoundingClientRect(),x=e.clientX-b.left-56,y=e.clientY-b.top-56,l=Math.max(1,Math.hypot(x,y));joy.x=x/l*Math.min(1,l/40);joy.y=y/l*Math.min(1,l/40);nub.style.transform='translate('+joy.x*35+'px,'+joy.y*35+'px)'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);joystick(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))joystick(e)};stick.onpointerup=()=>{joy.x=joy.y=0;nub.style.transform=''};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')ability('dash');if(e.key.toLowerCase()==='q')ability('infect');if(e.key.toLowerCase()==='e')ability('hypno')};onkeyup=e=>keys[e.key.toLowerCase()]=false;$('start').onclick=()=>{$('intro').style.display='none';playing=true};let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;try{if(playing){t+=dt;for(let k of ['attack','dash','infect','hypno','inv'])player[k]=Math.max(0,player[k]-dt);let x=joy.x+(keys.d?1:0)-(keys.a?1:0),y=joy.y+(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(x,y);if(l>.05){move(player,x/l*200*dt,y/l*200*dt);player.dir=Math.atan2(y,x)}if(pressed.fire||keys.j)ability('fire');for(let z of zones){z.life-=dt;for(let e of enemies)if(Math.hypot(e.x-z.x,e.y-z.y)<z.r){e.hp-=24*dt;e.poison=.3}}zones=zones.filter(z=>z.life>0);for(let e of enemies){e.stun=Math.max(0,e.stun-dt);e.cd-=dt;let d=Math.hypot(e.x-player.x,e.y-player.y);if(e.stun<=0&&d<540){if(d>(e.boss?85:32))move(e,(player.x-e.x)/d*65*dt,(player.y-e.y)/d*65*dt,e.boss?33:16);else if(e.cd<=0&&player.inv<=0){player.hp=Math.max(0,player.hp-(e.boss?18:7));player.inv=.6;e.cd=1}}}enemies=enemies.filter(e=>e.hp>0);for(let f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt}fx=fx.filter(f=>f.life>0);cam.x+=(player.x-W/2-cam.x)*Math.min(1,dt*7);cam.y+=(player.y-H/2-cam.y)*Math.min(1,dt*7);let room=rooms.findIndex(q=>inArea(player.x,player.y,r(q.x,q.y,q.w,q.h)));$('stats').textContent='HP '+Math.ceil(player.hp)+' · СЕКТОР '+(room+1)+' · ЦЕЛИ '+enemies.length}g.fillStyle='#030a14';g.fillRect(0,0,W,H);g.save();g.translate(-cam.x,-cam.y);for(let q of rooms){let a=r(q.x,q.y,q.w,q.h);g.fillStyle=q.color;g.fillRect(a.x,a.y,a.w,a.h);g.strokeStyle='#9aefff18';for(let x=a.x;x<a.x+a.w;x+=35){g.beginPath();g.moveTo(x,a.y);g.lineTo(x,a.y+a.h);g.stroke()}for(let y=a.y;y<a.y+a.h;y+=35){g.beginPath();g.moveTo(a.x,y);g.lineTo(a.x+a.w,y);g.stroke()}g.strokeStyle='#71c9d288';g.lineWidth=5;g.strokeRect(a.x+8,a.y+8,a.w-16,a.h-16);g.fillStyle='#b6f8ff';g.font='bold 20px monospace';g.fillText(q.n,a.x+30,a.y+42);for(let i=0;i<4;i++){let xx=a.x+50+i*(a.w-100)/4;g.fillStyle='#71ffff';g.fillRect(xx,a.y+12,44,5);glow(xx+20,a.y+20,80,'#34dfff27')}}for(let q of bridges){let a=r(q.x,q.y,q.w,q.h);g.fillStyle='#203b4b';g.fillRect(a.x,a.y,a.w,a.h);g.strokeStyle='#61d9df';g.lineWidth=5;g.strokeRect(a.x+10,a.y+10,a.w-20,a.h-20)}for(let z of zones){glow(z.x,z.y,z.r,'#9bff7133');g.beginPath();g.arc(z.x,z.y,z.r,0,7);g.fillStyle='#8dff7120';g.fill();g.strokeStyle='#aaff77';g.stroke()}for(let o of objects)cube(o);for(let e of enemies)actor(e,false);actor(player,true);for(let f of fx){g.globalAlpha=Math.max(0,f.life/.6);g.fillStyle=f.color;g.fillRect(f.x,f.y,5,5)}g.globalAlpha=1;g.restore();}catch(e){$('err').textContent='ОШИБКА: '+e.message}requestAn

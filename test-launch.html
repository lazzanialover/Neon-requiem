<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON REQUIEM — TEST</title><style>html,body{margin:0;height:100%;background:#07131b;color:#aaffd9;font-family:system-ui}iframe{width:100%;height:100%;border:0}#launch{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#041018ee;z-index:10}button{padding:20px 25px;border:2px solid #59ffa5;border-radius:12px;background:#10392f;color:#baffd9;font-size:19px;font-weight:bold}#err{position:fixed;top:10px;left:10px;right:10px;background:#500;color:white;padding:8px;display:none;z-index:20}</style></head><body><iframe id="g" src="roy-play.html"></iframe><div id="launch"><button id="go">НАЧАТЬ ОПЕРАЦИЮ →</button></div><div id="err"></div><script>const f=document.getElementById('g'),go=document.getElementById('go'),panel=document.getElementById('launch'),err=document.getElementById('err');go.addEventListener('click',()=>{try{let w=f.contentWindow,doc=w.document,inner=w.document.getElementById('game');if(inner&&inner.tagName==='IFRAME'){w=inner.contentWindow;doc=w.document}const btn=doc.getElementById('start');if(!btn)throw Error('Кнопка игры не найдена');btn.click();if(getComputedStyle(doc.getElementById('intro')).display!=='none'){if(typeof w.start==='function')w.start();else throw Error('Игра не запустилась: ошибка игрового скрипта')}panel.style.display='none'}catch(e){err.style.display='block';err.textContent='Ошибка запуска: '+e.message}});</script></body></html>

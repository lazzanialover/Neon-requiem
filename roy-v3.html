<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>NEON REQUIEM — WALK V3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b}iframe{border:0;width:100%;height:100%}#status{position:fixed;top:5px;right:5px;background:#071f20e9;color:#6affb1;font:12px monospace;padding:5px;border:1px solid #4b8;pointer-events:none}</style></head><body><iframe id="game" src="index.html"></iframe><div id="status">ROY V4: ЗАГРУЗКА</div><script>
const frame=document.getElementById('game'),status=document.getElementById('status');
frame.onload=()=>{
 try{
 const w=frame.contentWindow;
 const source=`
(function(){
const original=actor;
actor=function(x,y,a,enemy=false,heavy=false,flash=0){
if(enemy){return original(x,y,a,enemy,heavy,flash)}
const dir=p.dir||'front',img=royArt[dir]||royArt.front;
if(!img||!img.complete||!img.naturalWidth)return original(x,y,a,enemy,heavy,flash);
const moving=!!(p.moving&&active),t=p.walk||0,phase=moving?Math.sin(t):0,opp=moving?Math.cos(t):0;
const iw=img.naturalWidth,ih=img.naturalHeight,dw=dir==='front'?59:56,dh=105;
const hip=ih*.68,shoulder=ih*.30,sx=-dw/2,sy=-85-(moving?Math.abs(opp)*2:0);
ctx.save();ctx.translate(x,y);
ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,20,21,6,0,0,Math.PI*2);ctx.fill();
for(const left of [false,true]){
const footLift=moving?Math.max(0,(left?opp:-opp))*9:0;
ctx.save();ctx.translate(sx+dw*(left?.28:.72),sy+dh*.68);
ctx.rotate((left?1:-1)*phase*.42);
ctx.drawImage(img,iw*(left?0:.48),hip,iw*.52,ih-hip,-dw*.26,-footLift,dw*.52,dh*.32);
ctx.restore();
}
ctx.save();ctx.translate(phase*2,0);
ctx.drawImage(img,0,0,iw,hip,sx,sy,dw,dh*.68);
ctx.restore();
// Arms already exist in the original torso sprite. Do not overlay duplicate arms.
ctx.restore();
};
window.__royV3=true;
})();
`;
 w.eval(source);
 if(!w.__royV3)throw Error('Замена рендера не подтверждена');
 status.textContent='ROY V4: АНИМАЦИЯ ПОДКЛЮЧЕНА';
 }catch(e){status.textContent='ROY V4: ОШИБКА '+e.message;status.style.color='#ff8a8a'}
};
</script></body></html>
